:root{--red:#d90429;--red2:#ef233c;--bg:#fff7f8;--card:#fff;--tx:#1b1b1f;--mut:#6f6a70;--line:#f3dfe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141214;--card:#1f1b1d;--tx:#f5f1f2;--mut:#a79fa3;--line:#352d30}}
:root[data-theme="dark"]{--bg:#141214;--card:#1f1b1d;--tx:#f5f1f2;--mut:#a79fa3;--line:#352d30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100vh;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:16px 14px 12px;border-radius:0 0 26px 26px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 8px 24px #d9042955}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:44px;display:grid;place-items:center;animation:pop .6s both}
.brand h1{margin:0;font-size:19px;font-weight:800;line-height:1.1}
.brand small{opacity:.85;font-size:12px}
.search{margin-top:12px;width:100%;border:0;border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;background:#fff;color:#1b1b1f;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;background:#ffffff30;color:#fff;transition:.25s}
.chip.on{background:#fff;color:var(--red);transform:scale(1.05)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;animation:up .5s both;transition:transform .2s,box-shadow .2s}
.card:active{transform:scale(.97)}
.ico{height:150px;border-radius:14px;background:#fff;overflow:hidden;display:grid;place-items:center}.ico img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:pop .5s both}

.card h3{margin:2px 0 0;font-size:13.5px;font-weight:800;line-height:1.35}
.card p{margin:0;font-size:11.5px;color:var(--mut);line-height:1.4;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.row b{color:var(--red);font-size:13px}
.add{border:0;width:34px;height:34px;border-radius:12px;background:var(--red);color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 12px #d9042960;transition:.15s}
.add:active{transform:scale(.85) rotate(90deg)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.fab{position:fixed;inset-inline:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border:0;border-radius:18px;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #d9042977;transform:translateY(140%);transition:transform .4s cubic-bezier(.2,1.2,.4,1);z-index:6}
.fab.show{transform:none}
.ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:.3s;z-index:8}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);z-index:9}
.sheet.on{transform:none}
.sheet h2{margin:0 0 10px;font-size:17px}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.it span{flex:1;font-weight:700}
.q{display:flex;align-items:center;gap:8px}
.q button{border:0;width:28px;height:28px;border-radius:9px;background:var(--line);color:var(--tx);font-weight:800;font-size:16px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin:14px 0}
.btn{width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;font:inherit;font-weight:800;padding:13px;font-size:15px}
textarea{width:100%;height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;padding:10px;margin-top:10px}
.inst{display:none;margin-top:10px;border:0;border-radius:12px;padding:8px 14px;background:#fff;color:var(--red);font:inherit;font-weight:800;font-size:13px;animation:pop .6s .3s both}
.big{width:100%;height:260px;object-fit:contain;background:#fff;border-radius:18px;margin-bottom:10px;animation:pop .4s both}
.tag{display:inline-block;background:var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.pr{color:var(--red);font-weight:800;font-size:20px;margin:4px 0 8px}
.det{margin:0 0 14px;padding:0;list-style:none}.det li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.det li:before{content:"✔";color:var(--red);margin-inline-end:8px}
.sub{margin:14px 0 6px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.opt{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 12px;font:inherit;font-size:13.5px;font-weight:700}
.opt.on{border-color:var(--red);background:#d9042912}
.fld{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;margin-top:8px}
.btn2{width:100%;border:2px solid var(--red);background:transparent;color:var(--red);border-radius:14px;font:inherit;font-weight:800;padding:11px;margin-top:8px}
.sm{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--mut)}
.er{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
.card{cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
