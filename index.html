function prodTab(){$("#ad").innerHTML=`<button class="btn" data-new>${I("plus")}منتج جديد</button>${PR.length?"":`<button class="btn ghost mt" data-seed>استيراد المنتجات الأولية</button>`}<p class="hint mt">${PR.length} منتج. اضغط القلم للتعديل، والعين لإخفاء المنتج إذا نفد.</p>`+PR.map(p=>`<div class="line">${p.img?`<img alt="" src="${E(p.img)}">`:""}<div class="t"><b>${E(p.n)}</b><span>${fmt(p.p)}${p.o?" · نفد":""}</span></div><div class="mini"><button data-ed="${E(p.id)}" aria-label="تعديل">${I("edit")}</button><button data-so="${E(p.id)}" aria-label="${p.o?"متوفر":"نفد"}">${I(p.o?"off":"eye")}</button><button data-rm="${E(p.id)}" aria-label="حذف">${I("trash")}</button></div></div>`).join("")}
function editView(id){ed=id||null;const p=id?G(id):{n:"",c:"c",p:"",s:"",d:"",img:""};eimg=p.img||"";
 open(`<div class="hd"><h2>${id?"تعديل منتج":"منتج جديد"}</h2><button class="x" data-adm aria-label="رجوع">${I("x")}</button></div>
 <label class="f">اسم المنتج<input class="fld" id="en" value="${E(p.n)}"></label><label class="f">القسم<select class="fld" id="ec">${Object.entries(C).map(([k,n])=>`<option value="${k}"${p.c==k?" selected":""}>${n}</option>`).join("")}</select></label><label class="f">السعر بالدينار<input class="fld" id="ep" type="number" inputmode="numeric" value="${E(p.p)}"></label><label class="f">وصف قصير<input class="fld" id="es" value="${E(p.s)}"></label><label class="f">المواصفات (كل وحدة بسطر)<textarea class="fld" id="ed" rows="5">${E(String(p.d||"").split("|").join("\n"))}</textarea></label>
 <label class="up">${I("img")}اختر صورة المنتج<input type="file" id="ef" accept="image/*" hidden></label><img class="big mt" id="ev" alt=""${eimg?` src="${E(eimg)}"`:' style="display:none"'}><p class="err" id="er"></p><button class="btn" data-sv>حفظ المنتج</button>`)}
async function saveP(){const n=$("#en").value.trim(),pr=parseInt($("#ep").value,10),s=$("#es").value.trim();if(!n||!(pr>0)){er("اكتب اسم المنتج وسعره.");return}if(!eimg){er("اختر صورة للمنتج.");return}
 const o={n,c:$("#ec").value,p:pr,s,d:$("#ed").value.split("\n").map(x=>x.trim()).filter(Boolean).join("|")||s||n,img:eimg};er("جاري الحفظ…");
 try{await API.saveProduct(ed,o,PR.reduce((m,p)=>Math.min(m,p.ord||0),0)-10);toast("تم حفظ المنتج");adminView("p")}catch(e){er("ما انحفظ المنتج: "+(e.code||e.message))}}
async function ordTab(){const el=$("#ad");el.innerHTML='<p class="hint">جاري تحميل الطلبات…</p>';try{const L=await API.listOrders();
 el.innerHTML=L.map(x=>{const l=/^https:\/\/maps\.google\.com\//.test(x.location||"")?x.location:"";return`<div class="oc"><div class="hd"><b>${E(x.name)}</b><span class="status ${x.status}">${ST[x.status]||""}</span></div><div class="hint"><a href="tel:${E(x.phone)}">${E(x.phone)}</a> · ${DL[x.delivery]||""} ${E(x.driver||"")}</div><div>${(x.items||[]).map(i=>E(i.n)+" ×"+E(i.q)).join("، ")}</div><div class="hint">${E(x.address||"")} ${l?`<a href="${E(l)}" target="_blank" rel="noopener">فتح الموقع</a>`:""}</div><div class="hd"><span class="price">${money(x.total)}</span></div><div class="sts">${Object.keys(ST).map(k=>`<button class="st${x.status==k?" on":""}" data-os="${x.id}|${k}">${ST[k]}</button>`).join("")}</div></div>`}).join("")||'<p class="hint">ما وصلت طلبات بعد.</p>'}catch(e){el.innerHTML='<p class="hint">ما قدرنا نحمّل الطلبات: '+E(e.code||e.message)+"</p>"}}
async function custTab(){const el=$("#ad");el.innerHTML='<p class="hint">جاري التحميل…</p>';try{const L=await API.listCustomers();el.innerHTML=`<p class="hint">${L.length} زبون مسجّل</p>`+L.map(x=>`<div class="line"><div class="t"><b>${E(x.name)}</b><span style="font-family:var(--fb)">${E(x.address||"")}</span></div><a href="tel:${E(x.phone)}">${E(x.phone)}</a></div>`).join("")}catch(e){el.innerHTML='<p class="hint">ما قدرنا نحمّل الزبائن: '+E(e.code||e.message)+"</p>"}}
function setTab2(){const d=S.dr;$("#ad").innerHTML=`<label class="f">واتساب المكتب (9647xxxxxxxxx)<input class="fld" id="sw" value="${E(S.wa)}"></label><label class="f">المندوب الأول<input class="fld" id="d1n" value="${E(d[0].n)}"></label><input class="fld" id="d1p" value="${E(d[0].p)}" aria-label="رقم المندوب الأول"><label class="f">المندوب الثاني<input class="fld" id="d2n" value="${E(d[1].n)}"></label><input class="fld" id="d2p" value="${E(d[1].p)}" aria-label="رقم المندوب الثاني"><label class="f">كلفة الدلفري<input class="fld" id="fd" type="number" value="${S.fee.d}"></label><label class="f">كلفة الوسيط<input class="fld" id="fw" type="number" value="${S.fee.w}"></label><label class="f">الاستلام من المكتب<input class="fld" id="fp" type="number" value="${S.fee.p}"></label><button class="btn mt" data-ss>حفظ الإعدادات</button>`}
async function saveSet(){const v=i=>$("#"+i).value.trim();const o={wa:v("sw"),dr:[{n:v("d1n"),p:v("d1p")},{n:v("d2n"),p:v("d2p")}],fee:{d:+v("fd")||0,w:+v("fw")||0,p:+v("fp")||0}};try{await API.saveSettings(o);toast("تم حفظ الإعدادات")}catch(e){er("ما انحفظت: "+(e.code||e.message))}}
/* events */
function inc(id,d){const p=G(id);if(!p||p.o)return;cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];sv();badge(d>0);refreshCtl(id);if(tab=="cart")cartView()}
document.addEventListener("click",async e=>{const t=e.target.closest("button,[data-tab-go]");if(!t){if(e.target.id=="ov")close();return}const d=t.dataset;
 if(d.tab)setTab(d.tab);else if(d.tabGo)setTab(d.tabGo);
 else if(d.k){cat=d.k;cats();grid()}
 else if(d.open)detail(d.open);
 else if(d.inc)inc(d.inc,1);else if(d.dec)inc(d.dec,-1);
 else if(d.close!==undefined)close();
 else if(d.dm){dm=d.dm;cartView()}else if(d.dr){dr=+d.dr;cartView()}
 else if(t.id=="loc"){navigator.geolocation?navigator.geolocation.getCurrentPosition(g=>{cu.l="https://maps.google.com/?q="+g.coords.latitude+","+g.coords.longitude;cartView()},()=>er("ما قدرنا نحدد موقعك. اكتب العنوان بدلاً منه.")):er("جهازك ما يدعم تحديد الموقع.")}
 else if(t.id=="send")send(dm=="d"?S.dr[dr].p:S.wa,false);else if(t.id=="send2")send(S.wa,true);
 else if(t.id=="asave"){const n=$("#an").value.trim(),p=$("#ap").value.trim(),a=$("#aa").value.trim();if(!n||!p){er("اكتب الاسم ورقم الهاتف.");return}AC={n,p,a};sa();cu.n=n;cu.p=p;cu.a=a;API.saveCustomer(AC);meView();toast("تم حفظ بياناتك")}
 else if(t.id=="aout"){AC=null;sa();cu={n:"",p:"",a:"",l:""};gate()}
 else if(t.id=="own")API.ownerLogin().catch(x=>alert("تعذر الدخول: "+(x.code||x.message)));
 else if(t.id=="olo"){await API.logout()}
 else if(t.id=="adm"||t.id=="adm2")adminView();
 else if(d.at)adminView(d.at);else if(d.adm!==undefined)adminView();
 else if(d.new!==undefined)editView(0);else if(d.ed)editView(d.ed);else if(d.sv!==undefined)saveP();
 else if(d.seed!==undefined){er("جاري الاستيراد…");try{const n=await API.seed();toast("تم استيراد "+n+" منتج")}catch(x){er("تعذر الاستيراد: "+(x.code||x.message))}}
 else if(d.ss!==undefined)saveSet();
 else if(d.os){const[id,k]=d.os.split("|");try{await API.setOrderStatus(id,k);ordTab()}catch(x){er("تعذر تحديث الحالة")}}
 else if(d.so){const p=G(d.so);try{await API.saveProduct(d.so,{o:p.o?0:1});setTimeout(()=>atab=="p"&&$("#ad")&&prodTab(),250)}catch(x){er("تعذر التحديث")}}
 else if(d.rm){if(arm==d.rm){try{await API.deleteProduct(d.rm);arm=null;toast("تم حذف المنتج");setTimeout(()=>prodTab(),250)}catch(x){er("تعذر الحذف")}}else{arm=d.rm;er("اضغط الحذف مرة ثانية للتأكيد.")}}
});
document.addEventListener("input",e=>{const i=e.target.id,v=e.target.value;if(i=="cn")cu.n=v;if(i=="cp")cu.p=v;if(i=="ca")cu.a=v});
document.addEventListener("change",e=>{if(e.target.id!="ef"||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);eimg=c.toDataURL("image/jpeg",.8);const v=$("#ev");v.src=eimg;v.style.display="block"};im.src=r.result};r.readAsDataURL(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
/* boot */
shell();render();
API.onProducts(L=>{PR=L;loaded=true;for(const id in cart)if(!G(id))delete cart[id];if(tab=="home")grid();else if(tab=="cart")cartView();badge();if(OWN&&atab=="p"&&$("#ad")&&$("#sh").classList.contains("on"))prodTab()});
API.onSettings(x=>{S={wa:x.wa||S.wa,dr:(x.dr&&x.dr.length>1)?x.dr:S.dr,fee:{...S.fee,...(x.fee||{})}};if(tab=="cart")cartView()});
API.onUser(o=>{OWN=o;$("#adm").hidden=!OWN;if(OWN)hideGate();else gate();if(tab=="me")meView();if(tab=="home")grid()});
API.onMyOrders(L=>{MY=L;if(tab=="orders")ordersView()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script></body></html>
